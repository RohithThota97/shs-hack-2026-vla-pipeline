[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hackpipe"
version = "0.1.0"
description = "Demo-to-deployment pipeline for the SHS Robotics & AI Hackathon 2026 (Challenge 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
video = ["av>=15,<16"]   # LeRobot 0.6.1 needs av<16 (its "dataset" extra)
dashboard = ["streamlit>=1.30"]
console = ["streamlit>=1.40", "plotly>=5"]
dev = ["pytest>=7", "huggingface_hub>=0.24"]
hub = ["huggingface_hub>=0.24"]
sources = ["huggingface_hub>=0.24", "gdown>=6"]           # Add demonstrations: HF, Google Drive links
cloud = ["fsspec>=2024.2", "s3fs", "gcsfs", "adlfs"]     # Add demonstrations: S3 / R2 / MinIO, GCS, Azure
subtasks = ["scipy>=1.10", "av>=15,<16", "pillow>=10"]   # hackpipe subtasks label: cube colours, review images

[project.scripts]
hackpipe = "hackpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
