# Sub-task labels for curriculum training (hackpipe subtasks label → hackpipe dataset create --subtasks).
# Which labelling rules each train/val source uses, by its folder name under data/raw/. A source not listed here is
# not labelled, and the curriculum trainer refuses a version where a train/val source has no labels.
# Rules and thresholds come from the team's make_subtasks.py / label_rand500_colors.py (docs/decisions.md).
sources:
  fr3_duo_handover_84: handover      # 30 fps: pick (L) | bring to handover | grasp (R) | release (L) | place (R)
  fr3_duo_rand500: cubes             # 6 fps:  pick A (L) | put A on B | pick C (R) | stack C on top
joints:                              # indices into the 16-D state / action vector (names in meta/info.json)
  left_arm: [0, 7]                   # slice start, stop
  right_arm: [8, 15]
  left_gripper: 7
  right_gripper: 15
still_rad_s: 0.02                    # an arm "moves" when its joints change faster than this (rad/s)
review_images: true                  # camera frames at every boundary, for a human check before approval
