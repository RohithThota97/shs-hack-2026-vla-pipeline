# Quality checks (R2) and dataset versioning (R3) for the FR3 Duo handover data.
# Column names follow LeRobotDataset v3 (meta/info.json of the provided datasets).

columns:
  episode: episode_index
  frame: frame_index
  timestamp: timestamp
  task_index: task_index
  state: observation.state
  action: action
  success: success             # per-frame success flag in the provided data

quality:
  # Episode length in seconds (frames / fps), so it works for every recording rate: night84 / lighting10 have
  # 2247 frames at 30 fps (74.9 s), rand500 339–369 frames at 6 fps (56.5–61.5 s).
  min_episode_seconds: 50      # shorter = likely cut off → REVIEW (was 2000 frames, which flagged all of rand500)
  max_episode_seconds: 83.34   # longer → REVIEW (≥ the earlier 2500 frames at 30 fps = 83.33 s)
  timestamp_tolerance_s: null  # null = half a frame period (0.5 / fps)
  gap_factor: 1.5              # a timestamp step > gap_factor / fps counts as missing frames
  check_videos: true           # decode every video; needs `pip install -e ".[video]"` (PyAV with AV1)
  # FR3 joint limits (rad) from the Franka FR3 datasheet, same for both arms; grippers normalised 0..1.
  # CONFIRM against the joint limits in the USD robot (Hackathon_FR3Duo.usd).
  joint_limits:
    observation.state: &fr3_duo_limits
      min: [-2.7437, -1.7837, -2.9007, -3.0421, -2.8065, 0.5445, -3.0159, 0.0,
            -2.7437, -1.7837, -2.9007, -3.0421, -2.8065, 0.5445, -3.0159, 0.0]
      max: [2.7437, 1.7837, 2.9007, -0.1518, 2.8065, 4.5169, 3.0159, 1.0,
            2.7437, 1.7837, 2.9007, -0.1518, 2.8065, 4.5169, 3.0159, 1.0]
    action: *fr3_duo_limits
  final_state:                 # from meta/fr3_episodes_extra.jsonl (final_metrics); failing → REVIEW
    require_at_rest: true
    min_footprint_margin_mm: 0.0   # box footprint inside the tray
    max_tilt_deg: 10.0
  accept_review_as_valid: false

splits:
  seed: 1000
  train: 0.9
  val: 0.1
  test: 0.0                    # the test split is the held-out source below
  group_key: null
  test_episodes: []
  # Whole datasets held out as the test split (other seeds and lighting); never in train/val.
  test_sources: [data/raw/fr3_duo_handover_lighting10]
  leakage_keys: [environment.seed]   # a test seed may never appear in train/val
  freeze_test: true                  # later versions must keep the same test demos

preprocessing:
  image_size: null             # keep 224×224; SmolVLA resizes with padding internally
  rename_map:                  # dataset key → SmolVLA (lerobot/smolvla_base) camera key; passed as --rename_map
    observation.images.external_camera: observation.images.camera1
    observation.images.left_wrist_camera: observation.images.camera2
    observation.images.right_wrist_camera: observation.images.camera3
