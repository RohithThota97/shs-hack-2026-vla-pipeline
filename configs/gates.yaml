# Quality gates (R6). Thresholds are TEAM TARGETS — agree them on Day 1, not industry standards.

data:
  require_approved_dataset: true

training:
  require_run_record: true

evaluation:
  min_runs: 20
  min_success_rate: 0.8              # proposed team target
  no_worse_than_current: true        # success rate must not drop vs the deployed model
  max_collision_rate_increase: 0.0   # vs deployed model
  max_safety_stop_rate_increase: 0.0 # vs deployed model
  max_latency_p95_ms: null           # set from the action-chunk duration once known

improve:
  target_success_rate: 0.8
  demos_per_gap: 20                  # suggested number of targeted demos per weak scenario category

# Post-training verdict (gates/verdict.py): DEPLOY / MORE TRAINING / HOLD: SIM UNVERIFIED / NOT EVALUATED.
# Gates and numbers from the team's deploy_gates.json (AI-project-work); edit here. Offline values come from
# `hackpipe eval --offline` on the test split (lighting10 — never the team's night84 "val" episodes, which are in
# our train split). block = decides the verdict, warn = reported only. Arm errors in rad.
offline:
  block:
    arm_error_mean_max: 0.015          # executed stream, all test steps
    arm_error_p99_max: 0.10
    worst_subtask_error_max: 0.02
    gripper_event_hit_rate_min: 0.95   # demo gripper changes matched within ±1 s
    robustness_ratio_max: 1.5          # chunk error with the variant ÷ unchanged baseline
    robustness_variants: [images_darker_x0.6, images_brighter_x1.4, state_noise_0.01rad, reworded_instruction]
    regression_vs_deployed_max: 1.05   # arm error ÷ the deployed model's (when one is deployed)
  warn:
    replan_latency_budget_ms: 166.7    # one prediction must fit a 6 Hz step
    replan_jump_vs_demo_max: 2.5       # joint jump at re-plan ÷ the demo's jumps (p95)
    gripper_timing_error_s_max: 0.5

online:                                # latest real Isaac Sim eval of the model (hackpipe eval --import)
  block:
    success_rate_min: 0.8
    median_stage_min: 3                # eval_isaac stages 0 not lifted … 4 on the tray
  require_replay_ok: true              # the recorded demo must succeed in the same scene (--replay), else HOLD
